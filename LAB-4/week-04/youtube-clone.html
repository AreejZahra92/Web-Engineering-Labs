<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Grey-box Clone</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
      }

      /* Page shell: Grid */
      .page {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: 60px 1fr;
        grid-template-areas:
          "header header"
          "sidebar main";
        min-height: 100vh;
      }

      /* Header: Flexbox */
      .header {
        grid-area: header;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        background: #f1f1f1;
        border-bottom: 1px solid #ccc;
      }
      .header .logo {
        width: 90px;
        height: 24px;
        background: #999;
      }
      .header .search {
        width: 40%;
        height: 32px;
        background: #ddd;
        border-radius: 20px;
      }
      .header .icons {
        display: flex;
        gap: 1rem;
      }
      .header .icons .icon {
        width: 28px;
        height: 28px;
        background: #999;
        border-radius: 50%;
      }

      /* Sidebar: Flexbox column */
      .sidebar {
        grid-area: sidebar;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 1rem;
        background: #fafafa;
        border-right: 1px solid #eee;
      }
      .sidebar .item {
        height: 30px;
        background: #ddd;
        border-radius: 4px;
      }

      /* Main content: Grid of video cards */
      .main {
        grid-area: main;
        padding: 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.5rem;
        align-content: start;
      }

      /* Video card: Flexbox column */
      .card {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .card .thumbnail {
        width: 100%;
        height: 130px;
        background: #ccc;
        border-radius: 8px;
      }
      .card .details {
        display: flex;
        gap: 0.5rem;
      }
      .card .avatar {
        width: 36px;
        height: 36px;
        background: #999;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .card .text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .card .title {
        height: 14px;
        background: #ddd;
        width: 90%;
      }
      .card .channel {
        height: 10px;
        background: #eee;
        width: 60%;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="logo"></div>
        <div class="search"></div>
        <div class="icons">
          <div class="icon"></div>
          <div class="icon"></div>
        </div>
      </header>

      <aside class="sidebar">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </aside>

      <main class="main">
        <div class="card">
          <div class="thumbnail"></div>
          <div class="details">
            <div class="avatar"></div>
            <div class="text">
              <div class="title"></div>
              <div class="channel"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="thumbnail"></div>
          <div class="details">
            <div class="avatar"></div>
            <div class="text">
              <div class="title"></div>
              <div class="channel"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="thumbnail"></div>
          <div class="details">
            <div class="avatar"></div>
            <div class="text">
              <div class="title"></div>
              <div class="channel"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="thumbnail"></div>
          <div class="details">
            <div class="avatar"></div>
            <div class="text">
              <div class="title"></div>
              <div class="channel"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="thumbnail"></div>
          <div class="details">
            <div class="avatar"></div>
            <div class="text">
              <div class="title"></div>
              <div class="channel"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="thumbnail"></div>
          <div class="details">
            <div class="avatar"></div>
            <div class="text">
              <div class="title"></div>
              <div class="channel"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
