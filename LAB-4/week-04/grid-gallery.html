<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grid gallery</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 1rem;
      }
      .photo {
        background: #ddd;
        text-align: center;
      }
      .photo img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
      }

      .gallery {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      @media (min-width: 640px) {
        .gallery {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 768px) {
        .gallery {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (min-width: 1024px) {
        .gallery {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (min-width: 1280px) {
        .gallery {
          grid-template-columns: repeat(4, 1fr);
          gap: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Grid gallery</h1>
    <section class="gallery">
      <div class="photo">
        <img src="https://picsum.photos/id/10/400/300" alt="Photo 1" />
      </div>
      <div class="photo">
        <img src="https://picsum.photos/id/20/400/300" alt="Photo 2" />
      </div>
      <div class="photo">
        <img src="https://picsum.photos/id/35/400/300" alt="Photo 3" />
      </div>
      <div class="photo">
        <img src="https://picsum.photos/id/40/400/300" alt="Photo 4" />
      </div>
      <div class="photo">
        <img src="https://picsum.photos/id/50/400/300" alt="Photo 5" />
      </div>
      <div class="photo">
        <img src="https://picsum.photos/id/60/400/300" alt="Photo 6" />
      </div>
    </section>
  </body>
</html>
